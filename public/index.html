<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hide & Seek – Backrooms</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
  #gameCanvas { display: block; }
  #info { position: fixed; top: 6px; left: 8px; color: rgba(255,255,255,0.7); font-size: 11px; z-index: 10; text-shadow: 1px 1px 2px #000; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="info"></div>
<script>
(function () {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const infoEl = document.getElementById("info");
  infoEl.textContent = "Server-Adresse: " + location.host;

  // DEBUG-Modus: Schaltet Kollision aus, zeigt Koordinaten an
  // UND legt die Hitbox halbtransparent über die Map, um zu prüfen ob alles exakt sitzt!
  let DEBUG = false;

  let gameState = "LOADING";
  let mapImage = new Image();
  let hitboxImage = new Image();
  let imagesLoadedCount = 0;
  let hitboxData = null;
  let mapW = 0, mapH = 0;

  function onImageLoaded() {
    imagesLoadedCount++;
    if (imagesLoadedCount === 2) {
      mapW = mapImage.width;
      mapH = mapImage.height;

      let offCanvas = document.createElement("canvas");
      offCanvas.width = mapW;
      offCanvas.height = mapH;
      let offCtx = offCanvas.getContext("2d", { willReadFrequently: true });

      // DER FIX: Die Hitbox wird gezwungen, sich EXAKT auf die Dimensionen der Map zu strecken!
      offCtx.drawImage(hitboxImage, 0, -10, mapW, mapH);
      hitboxData = offCtx.getImageData(0, 0, mapW, mapH);

      me.x = 1904;
      me.y = 2728;
      gameState = "START";
    }
  }
  mapImage.onload = onImageLoaded;
  hitboxImage.onload = onImageLoaded;

  mapImage.src = "Backroomsfinalmaybe.jpg";
  hitboxImage.src = "HITBOX.png";

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Zustand ----------
  let usernameInputText = "";
  let activeButtons = [];
  let ws = null, myId = null;
  let serverStatus = "LOBBY", serverWinner = null, serverHostId = null, serverPlayers = [];
  let serverGameStartTime = 0;

  const me = { x: 0, y: 0, angle: 0, role: "verstecker", isFound: false, speed: 4.5, radius: 8 };
  const renderPos = new Map();
  let lastMoveSent = 0;

  function isWalkable(x, y) {
    if (!hitboxData) return true;
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || x >= mapW || y < 0 || y >= mapH) return false;

    let idx = (y * mapW + x) * 4;
    let r = hitboxData.data[idx];
    let g = hitboxData.data[idx+1];
    let b = hitboxData.data[idx+2];
    let a = hitboxData.data[idx+3];

    // Transparent = Boden
    if (a < 50) return true;

    // Robuste Lila-Prüfung: Rot und Blau heben sich deutlich von Grün ab
    let isPurple = (r > 100 && b > 100 && (r - g > 25) && (b - g > 25));

    if (DEBUG) return true;
    return !isPurple;
  }

  function canMoveTo(x, y, radius) {
    const pts = [
      {x: x, y: y}, {x: x-radius, y: y}, {x: x+radius, y: y}, {x: x, y: y-radius}, {x: x, y: y+radius},
      {x: x-radius*0.7, y: y-radius*0.7}, {x: x+radius*0.7, y: y-radius*0.7},
      {x: x-radius*0.7, y: y+radius*0.7}, {x: x+radius*0.7, y: y+radius*0.7}
    ];
    for (let p of pts) {
      if (!isWalkable(p.x, p.y)) return false;
    }
    return true;
  }

  // ---------- Verbindung ----------
  function connect(name) {
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host);

    ws.onopen = () => ws.send(JSON.stringify({ type: "join", name }));

    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === "joined") {
        myId = msg.id;
        gameState = "LOBBY_ROOM";
        ws.send(JSON.stringify({ type: "move", x: me.x, y: me.y, angle: me.angle }));
      } else if (msg.type === "join_rejected") {
        alert("Server voll."); gameState = "LOBBY_SELECT";
      } else if (msg.type === "state") {
        serverStatus = msg.status; serverWinner = msg.winner;
        serverHostId = msg.hostId; serverPlayers = msg.players;
        serverGameStartTime = msg.gameStartTime;
        const mine = serverPlayers.find(p => p.id === myId);
        if (mine) {
          me.role = mine.role; me.isFound = mine.isFound;
          if (gameState === "LOBBY_ROOM" && serverStatus === "PLAYING") gameState = "PLAYING";
          if (gameState === "PLAYING" && serverStatus === "LOBBY") gameState = "LOBBY_ROOM";
        }
      }
    };
    ws.onclose = () => { if (gameState !== "START" && gameState !== "LOBBY_SELECT") gameState = "DISCONNECTED"; };
  }

  // ---------- Zeichnen ----------
  function drawButton(text, x, y, w, h, base, hover, cb) {
    const hovered = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
    ctx.fillStyle = hovered ? hover : base; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#222"; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = "#fff"; ctx.font = "14px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, x + w / 2, y + h / 2);
    activeButtons.push({ x, y, w, h, cb });
  }

  function drawCenterScreen(title, subtitle, action) {
    ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffdd66"; ctx.font = "bold 32px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(title, canvas.width/2, canvas.height/2 - 30);
    ctx.fillStyle = "#ccc"; ctx.font = "16px sans-serif";
    ctx.fillText(subtitle, canvas.width/2, canvas.height/2 + 10);
    if (action) action();
  }

  let camX = 0, camY = 0;

  function drawGame() {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);

    camX = me.x - canvas.width / 2;
    camY = me.y - canvas.height / 2;
    if (canvas.width < mapW) camX = Math.max(0, Math.min(mapW - canvas.width, camX));
    else camX = (mapW - canvas.width) / 2;
    if (canvas.height < mapH) camY = Math.max(0, Math.min(mapH - canvas.height, camY));
    else camY = (mapH - canvas.height) / 2;

    ctx.save();
    ctx.translate(-camX, -camY);

    // Map Zeichnen
    ctx.drawImage(mapImage, 0, 0);

    // Hitbox Visualisierung für exakten Abgleich
    if (DEBUG) {
      ctx.globalAlpha = 0.5;
      ctx.drawImage(hitboxImage, 0, -10, mapW, mapH);
      ctx.globalAlpha = 1.0;
    }

    if (!me.isFound) {
      ctx.save(); ctx.translate(me.x, me.y);
      ctx.beginPath(); ctx.arc(0, 0, me.radius, 0, Math.PI * 2);
      ctx.fillStyle = me.role === "sucher" ? "#ff2a2a" : "#ffe600";
      ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
      ctx.fill(); ctx.restore();
    }

    serverPlayers.forEach(p => {
      if (p.id === myId || p.isFound) return;
      let rp = renderPos.get(p.id) || { x: p.x, y: p.y };
      rp.x += (p.x - rp.x) * 0.25; rp.y += (p.y - rp.y) * 0.25;
      renderPos.set(p.id, rp);

      ctx.save(); ctx.translate(rp.x, rp.y);
      ctx.beginPath(); ctx.arc(0, 0, me.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.role === "sucher" ? "#ff2a2a" : "#ffe600"; ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(p.name, rp.x, rp.y - 22);
    });

    ctx.restore();

    // UI Elemente (werden nicht von der Kamera verschoben)
    if (DEBUG) {
      ctx.fillStyle = "#00ff00";
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`X: ${Math.floor(me.x)} | Y: ${Math.floor(me.y)}`, 20, 50);
    }

    if (gameState === "PLAYING" && me.role === "sucher") {
      let timeLeft = 15 - Math.floor((Date.now() - serverGameStartTime) / 1000);
      if (timeLeft > 0) {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height); // Sucher sieht nur einen schwarzen Screen
        ctx.fillStyle = "#ff2a2a";
        ctx.font = "bold 30px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`WARTE! Verstecker fliehen... ${timeLeft}s`, canvas.width / 2, canvas.height / 2);
      }
    }

    if (serverWinner) {
      ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawCenterScreen("SPIEL VORBEI", "Gewinner: " + serverWinner.toUpperCase(), () => {
        if (myId === serverHostId) {
          drawButton("ZURÜCK ZUR LOBBY", canvas.width/2 - 110, canvas.height/2 + 40, 220, 40, "#444", "#666", () => {
            ws.send(JSON.stringify({ type: "reset_lobby" }));
          });
        }
      });
    }
  }

  // ---------- Eingabe ----------
  const keys = {};
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (gameState === "START" && (k === " " || k === "enter")) { gameState = "LOBBY_SELECT"; return; }
    if (gameState === "LOBBY_SELECT") {
      if (e.key.length === 1) usernameInputText += e.key;
      if (e.key === "Backspace") usernameInputText = usernameInputText.slice(0, -1);
      return;
    }
    keys[k] = true;
  });
  window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

  const mouse = { x: 0, y: 0 };
  window.addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener("click", () => {
    for (const b of activeButtons) {
      if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) { b.cb(); break; }
    }
  });

  function update() {
    if (gameState !== "PLAYING" || serverWinner || me.isFound) return;

    if (me.role === "sucher" && (Date.now() - serverGameStartTime) < 15000) {
      return;
    }

    let mx = 0, my = 0;
    if (keys["w"] || keys["arrowup"]) my -= 1;
    if (keys["s"] || keys["arrowdown"]) my += 1;
    if (keys["a"] || keys["arrowleft"]) mx -= 1;
    if (keys["d"] || keys["arrowright"]) mx += 1;
    if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }

    let nextX = me.x + mx * me.speed;
    let nextY = me.y + my * me.speed;

    if (canMoveTo(nextX, me.y, me.radius)) me.x = nextX;
    if (canMoveTo(me.x, nextY, me.radius)) me.y = nextY;

    me.angle = Math.atan2(mouse.y - (me.y - camY), mouse.x - (me.x - camX));

    if (me.role === "sucher") {
      serverPlayers.forEach(p => {
        if (p.id !== myId && p.role === "verstecker" && !p.isFound) {
          if (Math.hypot(me.x - p.x, me.y - p.y) < me.radius * 2 + 5) {
            ws.send(JSON.stringify({ type: "found", targetId: p.id }));
          }
        }
      });
    }

    const now = Date.now();
    if (now - lastMoveSent > 50 && (mx !== 0 || my !== 0)) {
      lastMoveSent = now;
      ws.send(JSON.stringify({ type: "move", x: me.x, y: me.y, angle: me.angle }));
    }
  }

  function loop() {
    activeButtons = [];
    update();

    if (gameState === "LOADING") {
      drawCenterScreen("LÄDT MAP...", "Bitte warten...");
    } else if (gameState === "START") {
      drawCenterScreen("HIDE AND SEEK", "Leertaste drücken");
    } else if (gameState === "LOBBY_SELECT") {
      drawCenterScreen("NAME EINGEBEN", location.host, () => {
        ctx.fillStyle = "#111"; ctx.fillRect(canvas.width/2 - 150, canvas.height/2 + 30, 300, 40);
        ctx.fillStyle = "#fff"; ctx.font = "18px sans-serif"; ctx.textAlign="left";
        const cursor = Math.floor(Date.now() / 500) % 2 === 0 ? "_" : "";
        ctx.fillText(usernameInputText + cursor, canvas.width/2 - 135, canvas.height/2 + 56);
        drawButton("BEITRETEN", canvas.width/2 - 100, canvas.height/2 + 90, 200, 40, "#1a5e22", "#2e8b37", () => {
          if (usernameInputText.trim().length > 0) connect(usernameInputText.trim());
        });
      });
    } else if (gameState === "LOBBY_ROOM") {
      drawCenterScreen("LOBBY (" + serverPlayers.length + "/15)", "", () => {
        serverPlayers.forEach((p, i) => {
          ctx.fillStyle = p.id === myId ? "#223322" : "#111";
          ctx.fillRect(canvas.width/2 - 200, canvas.height/2 - 40 + i*40, 400, 34);
          ctx.fillStyle = "#fff"; ctx.textAlign="left";
          ctx.fillText(p.name + (p.id === serverHostId ? " (HOST)" : ""), canvas.width/2 - 180, canvas.height/2 - 18 + i*40);
        });
        if (myId === serverHostId) {
          const ok = serverPlayers.length >= 2;
          drawButton(ok ? "STARTEN" : "MIN. 2 SPIELER", canvas.width/2 - 100, canvas.height/2 + 250, 200, 40, ok ? "#e67e22" : "#333", ok ? "#d35400" : "#333", () => {
            if (ok) ws.send(JSON.stringify({ type: "start_game" }));
          });
        }
      });
    } else if (gameState === "PLAYING") {
      drawGame();
    } else if (gameState === "DISCONNECTED") {
      drawCenterScreen("VERBINDUNG ABGEBROCHEN", "Bitte lade die Seite neu (F5)");
    }

    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
